name: Bug report
description: Report a reproducible problem with Browser Profile Router.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include browser history, cookies, profile data, or credentials.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and macOS version
    validations:
      required: true
